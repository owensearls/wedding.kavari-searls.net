name: Deploy

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `predeploy` runs `pnpm --filter 'frontend...' build`, which builds
      # rsc-utils (via its dist/) before the app's `vite build`. `deploy`
      # points wrangler at the *generated* config in dist/rsc/. Pre-script
      # auto-run requires enable-pre-post-scripts=true in .npmrc.
      - name: Deploy frontend worker
        run: pnpm --filter frontend run deploy
