name = "wedding"
main = "./src/entry.worker.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "wedding.kavari-searls.net", custom_domain = true },
  { pattern = "kavari-searls.net", custom_domain = true },
  { pattern = "www.kavari-searls.net", custom_domain = true },
]

# Production serves only the custom domains, but CI preview uploads
# (wrangler versions upload in preview.yml) need workers.dev preview URLs.
# Routes alone default workers_dev to false, which also drops preview
# URLs — keep them explicitly enabled.
workers_dev = false
preview_urls = true

[[d1_databases]]
binding = "DB"
database_name = "wedding-kavari-searls"
# Shared D1 between frontend and rsvp
database_id = "72251762-9df1-4281-8ccb-4039a763839d"
migrations_dir = "../db/migrations"

[assets]
directory = "./dist/client"
binding = "ASSETS"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
